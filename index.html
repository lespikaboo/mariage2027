<html lang="fr">
<head>

<title>Eva &amp; Nicolas — 6, 7, 8 août 2027</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&amp;family=Jost:wght@300;400;500[...]
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&family=Parisienne&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --cream:#F5F1E6;
  --cream-2:#ECE6D3;
  --ink:#2C2B22;
  --pine:#7C8B5E;
  --pine-dark:#5B6B45;
  --clay:#8A7A52;
  --gold:#7C8B5E;
  --mist:#AAB795;
  --line:rgba(44,43,34,0.14);
  --line-invert:rgba(245,241,230,0.28);
  --shadow:0 20px 50px rgba(44,43,34,0.16);
  --max:1180px;
  --wax:#A8524A;
  --wax-dark:#7E362E;
  --paper:#F3ECDC;
  --paper-dark:#E4DAC2;
  --sage:#EDF0E1;
  --sage-line:rgba(91,107,69,0.28);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:'Jost',sans-serif;
  font-weight:300;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Fraunces',serif;
  font-weight:500;
  margin:0;
  color:var(--pine-dark);
}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
button{font-family:inherit;}

.eyebrow{
  font-family:'Jost',sans-serif;
  text-transform:uppercase;
  letter-spacing:.22em;
  font-size:.72rem;
  color:var(--clay);
  font-weight:500;
}

.wrap{max-width:var(--max);margin:0 auto;padding:0 6vw;}

/* ============ ENVELOPPE D'INTRODUCTION ============ */
body.intro-active{overflow:hidden;height:100vh;}

.envelope-intro{
  position:fixed;inset:0;z-index:1000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;
  background:var(--pine-dark);
  transition:opacity .9s ease .15s, visibility .9s ease .15s;
}
.envelope-intro.opened{opacity:0;visibility:hidden;pointer-events:none;}

.envelope-scene{perspective:1600px;display:flex;flex-direction:column;align-items:center;gap:30px;}

.envelope{
  position:relative;width:min(640px,94vw,78vh);aspect-ratio:960/577;margin-top:min(26vh,34vw);container-type:inline-size;cursor:pointer;
}
.envelope-body{
  position:absolute;inset:0;
  background:url("data:image/webp;base64,UklGRqRcAABXRUJQVlA4WAoAAAAQAAAAvwMAQAIAQUxQSI4BAAANkGTb2rFHz8/YSde2jQFwuBmBUTYHYLvq+3pZ6b+NHRETEFGor4vK6FApUut3V1+zH78iqv1zg4UoFCK5zvP4dXX0p3lz53OWZ3mk112LjdW[...]
  filter:drop-shadow(0 28px 34px rgba(0,0,0,.38));
}
.envelope-flap{
  position:absolute;inset:0;
  transform-origin:top center;transform:perspective(1400px) rotateX(0deg);
  transform-style:preserve-3d;
  transition:transform 1.25s cubic-bezier(.65,0,.35,1) .12s, z-index 0s linear .8s;
  z-index:6;
}
.flap-face{
  position:absolute;inset:0;
  background:center/100% 100% no-repeat;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  filter:drop-shadow(0 2px 3px rgba(80,55,30,.18));
}
.flap-front{background-image:url("data:image/webp;base64,UklGRhK+AABXRUJQVlA4WAoAAAAQAAAAvwMAQAIAQUxQSDcyAAANGYdpJDkSvdXvO/+EjxsDH0BE/yfg7GZL9hxEsqcAJNke4UYaoSL3lJrdSGpKau4ApV9sVyCVnKihcAdJpNoHzjmJlQB[...]
.flap-back{background-image:url("data:image/webp;base64,UklGRh5BAABXRUJQVlA4WAoAAAAQAAAAvwMAQAIAQUxQSCIVAAAB8IdtuyIn2vaxVnV1p9NJJx0lRhLcgru7wwgWBne3UWRmcHd3J8gwgg437j4MMoHAhCAhRpKOdLrTUlXrenQGQtJdtdYf[...]
.envelope.open .envelope-flap{transform:perspective(1400px) rotateX(-172deg);z-index:2;}
.envelope-body{z-index:1;}
.envelope-pocket{
  position:absolute;inset:0;z-index:5;pointer-events:none;
  background:url("data:image/webp;base64,UklGRvxnAABXRUJQVlA4WAoAAAAQAAAAvwMAQAIAQUxQSOwWAAABHMVt2zjS/mtfS7t3REwAU6tGaZRRRmmUURpllIB/CCcsj4j2gP2/Iqf9/+XMzFo2G3cIJEAaCJDgWsNKoRQppRDqXigu9RavvXGr4+7uUMM[...]
  filter:drop-shadow(0 -2px 3px rgba(60,40,20,.12));
}
.envelope-body, .envelope-pocket{transition:opacity .8s ease;}
.flap-face{transition:opacity .8s ease;}

.seal{
  position:absolute;left:49.6%;top:54.2%;transform:translate(-50%,-50%);
  width:19%;aspect-ratio:1;border-radius:50%;
  z-index:7;cursor:pointer;
  animation:sealPulse 2.8s ease-in-out infinite;
  transition:opacity .4s ease;
}
.envelope.open .seal{opacity:0;animation:none;}
@keyframes sealPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(168,82,74,.35);}
  50%{box-shadow:0 0 0 12px rgba(168,82,74,0);}
}

.envelope-hint{
  color:var(--cream);opacity:.75;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;
  transition:opacity .4s ease;
}
.envelope.open ~ .envelope-hint{opacity:0;}
.envelope-darkmode{
  display:none;flex-direction:column;align-items:center;gap:10px;
  max-width:290px;margin:18px auto 0;padding:0 16px;text-align:center;
  font-family:'Jost',sans-serif;font-style:normal;font-weight:300;font-size:.8rem;line-height:1.6;letter-spacing:.03em;
  color:var(--cream);opacity:.72;transition:opacity .4s ease;
}
.envelope-darkmode svg{flex:none;width:18px;height:18px;opacity:.85;}
.envelope.open ~ .envelope-darkmode{opacity:0;}
@media (hover:none) and (pointer:coarse){.envelope-darkmode{display:flex;}}

.envelope-clip{
  position:absolute;left:-20%;right:-20%;bottom:0;top:-300vh;
  overflow:hidden;z-index:4;pointer-events:none;
}
.envelope-card{
  position:absolute;left:50%;top:0;
  transform:translate(-50%,0);
  transition:transform 1.1s cubic-bezier(.22,.9,.32,1);
}
.envelope-card img{
  display:block;width:100%;height:100%;object-fit:cover;border-radius:2px;
  box-shadow:0 10px 30px rgba(20,24,18,.35);
}
.envelope.expand .envelope-card{transition:transform 1.5s cubic-bezier(.65,0,.35,1);}
.envelope{transition:transform 1.5s cubic-bezier(.65,0,.35,1);}

.enter-hint{
  position:fixed;left:0;right:0;bottom:2.6vh;text-align:center;
  color:var(--cream);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;
  opacity:0;pointer-events:none;transition:opacity .6s ease;
}
.envelope-intro.shown{cursor:pointer;}

/* ---- Fondu faire-part -> site ---- */
.envelope-intro.opened{transition:opacity 2.1s cubic-bezier(.45,0,.25,1) .45s, visibility 0s linear 2.55s;}
.envelope-card img{transition:opacity 1.7s ease, transform 2.4s cubic-bezier(.2,.7,.2,1), filter 1.7s ease;}
.envelope-intro.leaving .envelope-card img{opacity:0;transform:scale(1.07);filter:blur(5px);}
.envelope-intro.leaving .enter-hint{opacity:0 !important;animation:none;transition:opacity .3s ease;}
.hero-photo{transition:transform 3.6s cubic-bezier(.2,.7,.2,1) .2s;}
body.pre-reveal .hero-photo{transform:scale(1.08);}
/* ---- Texte d'accueil écrit de gauche à droite ---- */
.hero-eyebrow, .hero-names, .hero-sub{width:fit-content;margin-left:auto;margin-right:auto;}
.hero-eyebrow, .hero-names, .hero-ridge, .hero-sub{
  -webkit-mask-image:linear-gradient(90deg,#000 45%,transparent 55%);
          mask-image:linear-gradient(90deg,#000 45%,transparent 55%);
  -webkit-mask-size:220% 100%;mask-size:220% 100%;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:100% 0;mask-position:100% 0;
}
.hero-scroll{opacity:0;transition:opacity 1.2s ease 5.9s;}
@keyframes heroWrite{
  0%{-webkit-mask-position:100% 0;mask-position:100% 0;}
  99.9%{-webkit-mask-position:0 0;mask-position:0 0;-webkit-mask-image:linear-gradient(90deg,#000 45%,transparent 55%);mask-image:linear-gradient(90deg,#000 45%,transparent 55%);}
  100%{-webkit-mask-position:0 0;mask-position:0 0;-webkit-mask-image:none;mask-image:none;}
}
body:not(.pre-reveal) .hero-eyebrow{animation:heroWrite 1.1s cubic-bezier(.45,.1,.4,1) 1.4s both;}
body:not(.pre-reveal) .hero-names{animation:heroWrite 1.9s cubic-bezier(.45,.1,.4,1) 2.2s both;}
body:not(.pre-reveal) .hero-ridge{animation:heroWrite .9s cubic-bezier(.45,.1,.4,1) 3.9s both;}
body:not(.pre-reveal) .hero-sub{animation:heroWrite 1.2s cubic-bezier(.45,.1,.4,1) 4.5s both;}
body:not(.pre-reveal) .hero-scroll{opacity:.8;}
@media (prefers-reduced-motion: reduce){
  .hero-eyebrow, .hero-names, .hero-ridge, .hero-sub{-webkit-mask-image:none;mask-image:none;animation:none !important;}
  .hero-scroll{opacity:.8;transition:none;}
}

/* ---- Menu caché sur la page d'accueil ---- */
.nav.nav-hidden{opacity:0;transform:translateY(-100%);pointer-events:none;}
.envelope-intro.shown .enter-hint{opacity:.8;animation:hintPulse 2.4s ease-in-out infinite .6s;}
@keyframes hintPulse{0%,100%{opacity:.8}50%{opacity:.4}}

@media (prefers-reduced-motion: reduce){
  .envelope-flap, .seal, .envelope-intro, .envelope-card, .envelope-body, .envelope-pocket{transition:none !important;}
  .seal{animation:none;}
}


/* ============ PAGE MOT DE PASSE ============ */
.pw-gate{
  position:fixed;inset:0;z-index:1100;
  display:flex;align-items:center;justify-content:center;
  padding:24px 16px;background:var(--pine-dark);color:var(--cream);
  text-align:center;overflow-y:auto;
  transition:opacity .9s ease, visibility 0s linear .9s;
}
.pw-gate.unlocked{opacity:0;visibility:hidden;pointer-events:none;}
.pw-inner{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;}
.pw-eyebrow{font-family:'Jost',sans-serif;text-transform:uppercase;letter-spacing:.28em;font-size:.72rem;font-weight:500;opacity:.8;}
.pw-names{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(2.6rem,11vw,3.6rem);line-height:1;margin:16px 0 0;color:#FBF6EC;}
.pw-sep{display:flex;align-items:center;gap:12px;margin:22px 0 26px;opacity:.6;}
.pw-sep span{width:46px;height:1px;background:var(--cream);}
.pw-sep i{width:5px;height:5px;border-radius:50%;background:var(--cream);}
.pw-label{font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:1.05rem;line-height:1.5;margin:0 0 22px;opacity:.92;}
.pw-form{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px;}
.pw-input{
  width:100%;max-width:280px;background:transparent;border:none;border-bottom:1px solid var(--line-invert);
  color:var(--cream);font-family:'Jost',sans-serif;font-size:1.05rem;letter-spacing:.12em;text-align:center;
  padding:10px 4px;border-radius:0;outline:none;transition:border-color .3s ease;
}
.pw-input::placeholder{color:var(--cream);opacity:.45;letter-spacing:.08em;}
.pw-input:focus{border-bottom-color:var(--cream);}
.pw-btn{
  margin-top:6px;background:var(--cream);color:var(--pine-dark);border:none;cursor:pointer;
  padding:14px 38px;border-radius:2px;font-family:'Jost',sans-serif;font-size:.72rem;font-weight:500;
  letter-spacing:.18em;text-transform:uppercase;transition:transform .3s ease, opacity .3s ease;
}
.pw-btn:hover{transform:translateY(-2px);}
.pw-btn:focus-visible{outline:2px solid var(--cream);outline-offset:4px;}
.pw-error{min-height:1.4em;margin:0;font-size:.82rem;color:#F1C9C2;letter-spacing:.03em;opacity:0;transition:opacity .3s ease;}
.pw-error.show{opacity:1;}
.pw-form.shake{animation:pwShake .45s ease;}
@keyframes pwShake{20%,60%{transform:translateX(-8px);}40%,80%{transform:translateX(8px);}}
.envelope{outline:none;-webkit-tap-highlight-color:transparent;}
.envelope:focus-visible{outline:1px solid rgba(245,241,230,.5);outline-offset:8px;}
.pw-gate .envelope-darkmode{display:flex;margin-top:34px;opacity:.72;}
@media (prefers-reduced-motion: reduce){.pw-gate{transition:none;}.pw-form.shake{animation:none;}}

/* ============ SCROLL REVEAL ============ */
.reveal{
  opacity:0;
  transform:translateY(28px);
  transition:opacity 1s cubic-bezier(.16,.8,.24,1), transform 1s cubic-bezier(.16,.8,.24,1);
}
.reveal.is-visible{opacity:1;transform:translateY(0);}
.reveal-delay-1{transition-delay:.12s;}
.reveal-delay-2{transition-delay:.24s;}
.reveal-delay-3{transition-delay:.36s;}

@media (prefers-reduced-motion: reduce){
  .reveal{opacity:1;transform:none;transition:none;}
  html{scroll-behavior:auto;}
}

/* ============ NAV ============ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:26px 6vw;
  background:var(--cream);
  transition:padding .4s ease, box-shadow .4s ease, opacity .5s ease, transform .5s ease;
}
.nav.solid{
  padding:16px 6vw;
  box-shadow:0 1px 0 var(--line);
}
.nav-mark{
  position:relative;display:flex;align-items:center;gap:8px;
  font-family:'Cormorant Garamond',serif;font-weight:400;
  font-size:1.9rem;line-height:1;color:var(--ink);letter-spacing:.02em;
  padding-right:14px;
}
.nav-mark .rule{width:1px;height:1.25em;background:var(--ink);opacity:.45;}
.nav-flower{position:absolute;right:-18px;top:50%;width:58px;height:auto;transform:translateY(-36%) rotate(4deg);pointer-events:none;}
@media (max-width:640px){.nav-mark{font-size:1.6rem;gap:7px;}.nav-flower{width:50px;right:-16px;}}
.nav-links{display:flex;gap:34px;list-style:none;margin:0;padding:0;}
.nav-links a{
  font-size:.74rem;text-transform:uppercase;letter-spacing:.14em;
  color:var(--ink);opacity:.8;font-weight:500;
  padding-bottom:4px;border-bottom:1px solid transparent;
  transition:border-color .3s ease, opacity .3s ease;
}
.nav-links a.active{opacity:1;border-color:var(--pine);}
.nav-links a:hover{opacity:1;border-color:var(--pine);}
.nav-toggle{
  display:none;background:none;border:none;cursor:pointer;
  width:26px;height:20px;position:relative;z-index:110;
}
.nav-toggle span{
  display:block;height:1.5px;width:100%;background:var(--ink);
  position:absolute;left:0;transition:all .35s ease;
}
.nav-toggle span:nth-child(1){top:0;}
.nav-toggle span:nth-child(2){top:9px;}
.nav-toggle span:nth-child(3){top:18px;}
.nav-toggle.open span:nth-child(1){transform:rotate(45deg);top:9px;}
.nav-toggle.open span:nth-child(2){opacity:0;}
.nav-toggle.open span:nth-child(3){transform:rotate(-45deg);top:9px;}

@media (max-width:860px){
  .nav-links{
    position:fixed;inset:0;background:var(--pine-dark);
    flex-direction:column;justify-content:center;align-items:center;gap:30px;
    transform:translateY(-100%);transition:transform .5s cubic-bezier(.16,.8,.24,1);
  }
  .nav-links{visibility:hidden;height:100vh;height:100dvh;transition:transform .5s cubic-bezier(.16,.8,.24,1),visibility 0s linear .5s;}
  .nav-links.open{transform:translateY(0);visibility:visible;transition:transform .5s cubic-bezier(.16,.8,.24,1),visibility 0s;}
  .nav-links a{color:var(--cream) !important;font-size:1rem;opacity:1;}
  .nav-toggle{display:block;}
  .nav-toggle.open span{background:var(--ink);}
}

/* ============ HERO ============ */
.hero{
  position:relative;min-height:100vh;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:120px 0 90px;
  color:var(--cream);
  text-align:center;
}
.hero-photo{
  position:absolute;inset:0;z-index:0;
  background:url('data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCw[...]
}
.hero-photo::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(34,42,26,.3) 0%, rgba(34,42,26,.05) 32%, rgba(34,42,26,.12) 60%, rgba(34,42,26,.55) 100%);
}
/* REMPLACER : mettez ici l'URL de votre propre photo (les Pyrénées, ou vous deux) */
.hero-content{position:relative;z-index:5;padding:0 6vw;max-width:820px;}
.hero-eyebrow{
  display:block;font-size:.82rem;letter-spacing:.32em;text-transform:uppercase;
  color:var(--cream);opacity:.9;margin-bottom:22px;font-weight:500;
}
.hero-names{
  font-family:'Fraunces',serif;font-weight:500;
  font-size:clamp(3rem,8.5vw,5.6rem);letter-spacing:.02em;
  color:#FBF6EC;line-height:1;
  text-shadow:0 6px 30px rgba(24,30,18,.35);
}
.hero-amp{padding:0 .1em;}
.hero-ridge{margin:26px auto 22px;width:min(220px,50vw);opacity:.9;}
.hero-sub{
  font-size:.85rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--cream);opacity:.92;font-weight:500;margin-bottom:34px;
}
.hero-cta{
  display:inline-block;background:var(--pine);color:var(--cream);
  padding:16px 36px;border-radius:2px;font-size:.72rem;letter-spacing:.16em;
  text-transform:uppercase;border:none;cursor:pointer;
  transition:background .3s ease, transform .3s ease;
}
.hero-cta:hover{background:var(--pine-dark);transform:translateY(-2px);}
.hero-thanks{
  margin-top:28px;font-family:'Fraunces',serif;font-style:italic;font-weight:400;
  font-size:1.02rem;color:#F3ECDA;opacity:.92;max-width:480px;margin-left:auto;margin-right:auto;
}
.hero-scroll{
  margin-top:22px;display:flex;justify-content:center;
  color:var(--cream);opacity:.8;position:relative;z-index:5;
}
.hero-scroll svg{animation:bob 2.2s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(8px);}}
.hero-wave{
  position:absolute;left:0;right:0;bottom:-1px;z-index:3;line-height:0;
}
.hero-wave-mobile{display:none;}

/* Trait sous les vagues : se dessine de gauche à droite */
.wave-line{clip-path:inset(0 100% 0 0);-webkit-clip-path:inset(0 100% 0 0);transition:clip-path 2.2s cubic-bezier(.45,.1,.35,1) .2s, -webkit-clip-path 2.2s cubic-bezier(.45,.1,.35,1) .2s;}
.wave-line.is-visible{clip-path:inset(0 0 0 0);-webkit-clip-path:inset(0 0 0 0);}
@media (prefers-reduced-motion: reduce){.wave-line{clip-path:none;-webkit-clip-path:none;transition:none;}}
@media (max-width:640px){
  .hero-wave:not(.hero-wave-mobile){display:none;}
  .hero-wave-mobile{display:block;width:100%;height:70px;}
}

/* ============ SECTION SHELL ============ */
section{position:relative;padding:150px 0;scroll-margin-top:92px;}
.section-head{max-width:640px;margin-bottom:70px;}
.section-head h2{font-size:clamp(2.1rem,4.4vw,3.1rem);margin-top:10px;line-height:1.12;}
.section-head p{margin-top:18px;font-size:1.02rem;color:#4A473F;}

.divider-ridge{width:100%;display:block;color:var(--pine);opacity:.18;}

/* ============ BIENVENUE ============ */
.bienvenue{background:var(--cream);padding:40px 0 120px;overflow:hidden;position:relative;}
.bienvenue-wreath.br{display:none;}
#merci{align-items:flex-end;}
#merci .merci-inner{padding:0 6vw 70px;}
#merci .merci-inner h2{color:var(--cream);margin-top:0;}

.bienvenue-wave{position:absolute;left:0;right:0;bottom:-1px;z-index:3;width:100%;height:70px;display:block;pointer-events:none;}
.bienvenue .wrap{position:relative;z-index:1;}
.bienvenue-wreath{position:absolute;width:340px;height:340px;color:var(--pine);opacity:.8;pointer-events:none;}
.bienvenue-wreath.tl{top:-110px;left:-110px;}
.bienvenue-wreath.br{bottom:-110px;right:-110px;transform:rotate(180deg);}
.bienvenue-text{text-align:center;max-width:620px;margin:0 auto;}
.bienvenue-text .eyebrow{display:block;margin-bottom:0;color:var(--pine);}
.bienvenue-text h2{
  font-size:clamp(2.1rem,4.4vw,3.1rem);line-height:1.12;font-weight:500;color:var(--ink);
}
.bienvenue-sep{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px auto 20px;color:var(--pine);}
.bienvenue-sep span{width:60px;height:1px;background:var(--pine);opacity:.45;}

.bienvenue-float{position:absolute;color:var(--pine);opacity:.5;pointer-events:none;animation:drift 9s ease-in-out infinite;}

}
.story-full-photo img{

@media (max-width:760px){

  }

/* empêche le style .card des hébergements de s'appliquer au programme */
#programme .card{transition:none}
#programme .card:hover{box-shadow:0 8px 28px rgba(0,0,0,.18)}
/* Apparition des jours au défilement, l'un après l'autre */
#programme .card.reveal{transition:opacity 1s cubic-bezier(.16,.8,.24,1), transform 1s cubic-bezier(.16,.8,.24,1)}
@media (min-width:801px){
#programme .cards .card.reveal:nth-child(2){--d:.55s}
#programme .cards .card.reveal:nth-child(3){--d:1.1s}
}
/* Apparition progressive à l'intérieur de chaque jour :
   la carte → la date → le jour → l'accroche → la ligne du temps → chaque horaire */
#programme .card.reveal{--d:0s}
#programme .card.reveal.is-visible{transition-delay:var(--d)}
#programme .card.reveal .date,
#programme .card.reveal .day,
#programme .card.reveal .headline em,
#programme .card.reveal .catch,
#programme .card.reveal .event{
  opacity:0;
  transition:opacity .9s cubic-bezier(.16,.8,.24,1), transform .9s cubic-bezier(.16,.8,.24,1);
}
#programme .card.reveal .date{transform:translateX(-50%) scale(.35);transition-timing-function:ease,cubic-bezier(.34,1.56,.64,1)}
#programme .card.reveal .day{transform:translateY(10px);letter-spacing:12px;transition-property:opacity,transform,letter-spacing;transition-duration:.9s,.9s,1.3s}
#programme .card.reveal .headline i{transform:scaleX(0);transition:transform .9s cubic-bezier(.16,.8,.24,1)}
#programme .card.reveal .headline i:first-child{transform-origin:right}
#programme .card.reveal .headline i:last-child{transform-origin:left}
#programme .card.reveal .headline em{transform:scale(.4) rotate(-20deg)}
#programme .card.reveal .catch{transform:translateY(8px)}
#programme .card.reveal .timeline::before{transform:scaleY(0);transform-origin:top;transition:transform 2s cubic-bezier(.45,.1,.4,1)}
#programme .card.reveal .event{transform:translateY(14px)}

#programme .card.reveal.is-visible .date{opacity:1;transform:translateX(-50%) scale(1);transition-delay:calc(var(--d) + .35s)}
#programme .card.reveal.is-visible .day{opacity:1;transform:none;letter-spacing:5px;transition-delay:calc(var(--d) + .85s)}
#programme .card.reveal.is-visible .headline i{transform:scaleX(1);transition-delay:calc(var(--d) + 1.15s)}
#programme .card.reveal.is-visible .headline em{opacity:1;transform:none;transition-delay:calc(var(--d) + 1.3s)}
#programme .card.reveal.is-visible .catch{opacity:1;transform:none;transition-delay:calc(var(--d) + 1.5s)}
#programme .card.reveal.is-visible .timeline::before{transform:scaleY(1);transition-delay:calc(var(--d) + 1.9s)}
#programme .card.reveal.is-visible .event{opacity:1;transform:none}
#programme .card.reveal.is-visible .event:nth-child(1){transition-delay:calc(var(--d) + 2.0s)}
#programme .card.reveal.is-visible .event:nth-child(2){transition-delay:calc(var(--d) + 2.5s)}
#programme .card.reveal.is-visible .event:nth-child(3){transition-delay:calc(var(--d) + 3.0s)}
#programme .card.reveal.is-visible .event:nth-child(4){transition-delay:calc(var(--d) + 3.5s)}
@media (max-width:800px){#programme .card.reveal .day{letter-spacing:10px}}
@media (prefers-reduced-motion: reduce){
  #programme .card.reveal,
  #programme .card.reveal *,
  #programme .card.reveal .timeline::before{transition:none!important}
  #programme .card.reveal .date{opacity:1;transform:translateX(-50%)}
  #programme .card.reveal .day,#programme .card.reveal .headline em,#programme .card.reveal .catch,#programme .card.reveal .event{opacity:1;transform:none}
  #programme .card.reveal .day{letter-spacing:5px}
  #programme .card.reveal .headline i,#programme .card.reveal .timeline::before{transform:none}
}

#dress-code .dc-txt{position:absolute;left:var(--l);right:var(--r);top:var(--t);text-align:center;}
#dress-code .dc-txt h4{margin:0 0 var(--gap,2.5cqw);font-family:var(--dc-display);font-weight:500;letter-spacing:.06em;font-size:var(--hs);line-height:1.25;color:var(--hc,var(--dc-ink));}
#dress-code .dc-txt p{margin:0;font-family:var(--dc-body);font-weight:300;font-size:var(--ps);line-height:1.55;color:var(--dc-ink);}
#dress-code .c1{--l:17%;--r:8%;--t:48%;--hs:5.7cqw;--ps:4.7cqw;}
#dress-code .c2{--l:12%;--r:14%;--t:43%;--hs:5.7cqw;--ps:4.4cqw;}
#dress-code .c3{--l:11%;--r:10%;--t:61%;--hs:5.7cqw;--ps:4.2cqw;--gap:1.8cqw;}
#dress-code .c3 .dc-txt p{line-height:1.45;}
#dress-code .dc-dots{display:none;}

/* Dress code : apparition en fondu, personnes de gauche à droite puis pastilles */
#dress-code .dc-hero.reveal{
  opacity:0;transform:none;
  -webkit-mask-image:linear-gradient(to right,#000 40%,transparent 60%);mask-image:linear-gradient(to right,#000 40%,transparent 60%);
  -webkit-mask-size:250% 100%;mask-size:250% 100%;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:100% 0;mask-position:100% 0;
  transition:opacity .9s ease, -webkit-mask-position 3s cubic-bezier(.45,.1,.35,1), mask-position 3s cubic-bezier(.45,.1,.35,1);
}
#dress-code .dc-hero.reveal.is-visible{opacity:1;-webkit-mask-position:0 0;mask-position:0 0;}
#dress-code .dc-swatches.reveal{opacity:1;transform:none;transition:none;}
#dress-code .dc-swatches li{opacity:0;transform:scale(.4);transition:opacity .6s ease, transform .7s cubic-bezier(.3,1.5,.5,1);}
#dress-code .dc-swatches.is-visible li{opacity:1;transform:scale(1);}
#dress-code .dc-swatches.is-visible li:nth-child(1){transition-delay:1.5s}
#dress-code .dc-swatches.is-visible li:nth-child(2){transition-delay:1.72s}
#dress-code .dc-swatches.is-visible li:nth-child(3){transition-delay:1.94s}
#dress-code .dc-swatches.is-visible li:nth-child(4){transition-delay:2.16s}
#dress-code .dc-swatches.is-visible li:nth-child(5){transition-delay:2.38s}
#dress-code .dc-swatches.is-visible li:nth-child(6){transition-delay:2.6s}
#dress-code .dc-swatches.is-visible li:nth-child(7){transition-delay:2.82s}
#dress-code .dc-swatches.is-visible li:nth-child(8){transition-delay:3.04s}
